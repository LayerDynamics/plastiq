# Plastiq self-host — static SPA with large wasm payloads (OCCT, MuJoCo,
# sql.js, planegcs). Dropped in as /etc/nginx/conf.d/default.conf inside the
# stock nginx:alpine http{} block.
#
# NOTE: no COOP/COEP headers on purpose — every vendored wasm build is
# single-threaded (packages/sim/vendor/mujoco/PROVENANCE.md), so no
# SharedArrayBuffer and no cross-origin isolation requirement. If a
# multithreaded wasm build ever ships, this server must start sending
#   Cross-Origin-Opener-Policy: same-origin
#   Cross-Origin-Embedder-Policy: require-corp
# See docs/deploy.md.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the .gz siblings precompressed in the image build (gzip -9). The
    # nginx:alpine image has no brotli module; the brotli upgrade path is
    # documented in docs/deploy.md.
    gzip_static on;

    # Runtime-gzip fallback for anything without a precompressed sibling.
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # Hashed build artifacts (content-addressed filenames): cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # wasm MUST be served as application/wasm — WebAssembly.instantiateStreaming
    # hard-fails on any other Content-Type. (A types{} block replaces the
    # inherited map, which is fine scoped to this wasm-only location; it also
    # wins over the /assets/ prefix match for /assets/*.wasm, so those still
    # get the immutable header below.)
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html references the hashed assets — never cache it, so a redeploy
    # is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback. The app is single-route today (no client router), so this
    # is defensive: unknown paths render the app instead of a bare 404 page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
