# Conda env for the Plastiq reconstruction service. pythonocc-core (OCCT Python bindings)
# is conda-forge only — this is the source of truth for the runtime env (local + Docker).
#   mamba env create -f environment.yml   # then: mamba run -n plastiq-reconstruct ...
name: plastiq-reconstruct
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pythonocc-core
  - trimesh
  - numpy
  - scipy        # trimesh graph backend (facet/coplanar-region detection — R6.3)
  - networkx
  - fastapi
  - uvicorn
  - pydantic
  - python-multipart
  - httpx
  - pytest
  - pip
  - pip:
      # The fidelity (SCD) + recognition metric math runs in MLX on Apple Silicon. MLX is pip-only.
      # Deterministic (NFR-2): recognition math is seedless; fidelity sampling seeds mx.random from
      # a SHA-256 of the mesh geometry (fidelity.py:_seed_from_mesh), so the same mesh always
      # scores the same. Bare `mlx` ships a backend only on macOS (mlx-metal); on Linux the
      # Dockerfile and CI additionally `pip install "mlx[cpu]"`. Geometry is still OCCT/trimesh.
      - mlx
