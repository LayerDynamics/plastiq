# Conda env for the Plastiq reconstruction service. pythonocc-core (OCCT Python bindings)
# is conda-forge only — this is the source of truth for the runtime env (local + Docker).
#   mamba env create -f environment.yml   # then: mamba run -n plastiq-reconstruct ...
name: plastiq-reconstruct
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pythonocc-core
  - trimesh
  - numpy
  - scipy        # trimesh graph backend (facet/coplanar-region detection — R6.3)
  - networkx
  - fastapi
  - uvicorn
  - pydantic
  - python-multipart
  - httpx
  - pytest
  - pip
  - pip:
      # The fidelity (SCD) + recognition metric math runs in MLX on Apple Silicon (M1/M2c). MLX is
      # pip-only; deterministic by seed, so NFR-2 holds. Geometry still comes from OCCT/trimesh.
      - mlx
