# Custom (trimmed) opencascade.js build config — SPEC-4 Task 0.2 / R1 / NFR-4.
#
# The full prebuilt opencascade.js wasm is 48 MB raw / 13.2 MB gzip — far over the
# bundle budget (NFR-4 / Q10, proposed ≤ 3 MB compressed). This config produces a
# minimal build containing ONLY the OCCT symbols the kernel actually calls.
#
# IMPORTANT: the `bindings` list below is finalized once the kernel's OCCT symbol
# surface stabilizes (≈ M5). Until then, development runs against the prebuilt
# FULL build (`opencascade.js` from npm) — see scripts/build-occt.md. This file is
# the build MECHANISM; the symbol list is grown as features (M1–M5) land, each
# feature appending the OCCT classes it uses.
#
# Build:  just cad-occt   (Docker — see scripts/build-occt.md)
# Format reference: https://ocjs.org/docs/app-dev-workflow/custom-builds

mainBuild:
  name: mechx-occt.js
  bindings:
    # Geometry primitives + topology (Task 0.5/0.6, M1)
    - symbol: BRepPrimAPI_MakeBox
    - symbol: BRepPrimAPI_MakePrism # extrude (FR-4)
    - symbol: BRepPrimAPI_MakeRevol # revolve (FR-5)
    - symbol: BRepBuilderAPI_MakeEdge
    - symbol: BRepBuilderAPI_MakeWire
    - symbol: BRepBuilderAPI_MakeFace
    - symbol: BRepBuilderAPI_Transform # transform (FR-14)
    - symbol: TopExp_Explorer
    - symbol: BRepCheck_Analyzer # validity (NFR-1)
    # Booleans + dress-up (M2)
    - symbol: BRepAlgoAPI_Fuse # boolean (FR-7)
    - symbol: BRepAlgoAPI_Cut
    - symbol: BRepAlgoAPI_Common
    - symbol: BRepFilletAPI_MakeFillet # fillet (FR-8)
    - symbol: BRepFilletAPI_MakeChamfer # chamfer (FR-9)
    - symbol: BRepOffsetAPI_MakeThickSolid # shell (FR-10)
    - symbol: BRepOffsetAPI_MakeOffsetShape # offset (FR-11)
    # Loft/sweep (M3)
    - symbol: BRepOffsetAPI_ThruSections # loft (FR-12)
    - symbol: BRepOffsetAPI_MakePipe # sweep (FR-13)
    # Mass properties + tessellation (Task 0.6, FR-25/FR-3)
    - symbol: BRepGProp
    - symbol: GProp_GProps
    - symbol: BRepMesh_IncrementalMesh
    # Interchange (M5, FR-33)
    - symbol: STEPControl_Writer
    - symbol: STEPControl_Reader
    - symbol: IGESControl_Writer
    - symbol: IGESControl_Reader
  emccFlags:
    - -O3
    - -flto
    - --closure=1
    - -sEXPORT_ES6=1
    - -sMODULARIZE=1
    - -sUSE_PTHREADS=0 # single-threaded (SPEC-4 C6 / NFR-2 reproducibility)
    - -sALLOW_MEMORY_GROWTH=1
    - -sENVIRONMENT=web,node

# additionalBuilds: declare separately-loadable libs here if the trim ever needs
# to be split for lazy loading (R1 contingency).
additionalBuilds: []
