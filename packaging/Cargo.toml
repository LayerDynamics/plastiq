[package]
name = "plastiq-packaging"
version = "0.1.0"
edition = "2024"
description = "Built-in build, bundle, and packaging tooling for Plastiq"
license-file = "../LICENSE"

[[bin]]
name = "plastiq-packaging"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"
