name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a full commit SHA (supply-chain hardening) — the trailing
# comment records the human-readable version. Bump both together when updating.
jobs:
  checks:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # pnpm before setup-node so setup-node can prime the pnpm store cache.
      # The pnpm version comes from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

      - name: Lint
        run: pnpm run lint

      # Unit + integration suite — runs the real OCCT (vendored trimmed wasm),
      # planegcs, and physics backends in Node. No Docker / OCCT rebuild needed:
      # packages/cad/vendor/occt/plastiq-occt.wasm is committed.
      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  e2e:
    name: e2e (no-mock, browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Only Chromium is needed (playwright.config drives the `plastiq`
      # Desktop Chrome project). --with-deps installs the OS libraries.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Playwright starts the app's own Vite server (reuseExistingServer is off
      # when CI=true, which GitHub Actions sets) and drives the real editor:
      # browser → worker (OCCT) → planegcs → physics → render, no mocks.
      - name: Run E2E
        run: pnpm run e2e

      # On failure, keep the HTML report + traces/screenshots for debugging.
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
