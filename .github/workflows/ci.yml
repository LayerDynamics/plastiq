name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a full commit SHA (supply-chain hardening) — the trailing
# comment records the human-readable version. Bump both together when updating.
jobs:
  checks:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # pnpm before setup-node so setup-node can prime the pnpm store cache.
      # The pnpm version comes from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

      - name: Lint
        run: pnpm run lint

      # Unit + integration suite — runs the real OCCT (vendored trimmed wasm),
      # planegcs, and physics backends in Node. No Docker / OCCT rebuild needed:
      # packages/cad/vendor/occt/plastiq-occt.wasm is committed. Runs with
      # coverage so the configured threshold floor is enforced on every push.
      - name: Test (with coverage)
        run: pnpm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build
        run: pnpm run build

  e2e:
    name: e2e (no-mock, browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Only Chromium is needed (playwright.config drives the `plastiq`
      # Desktop Chrome project). --with-deps installs the OS libraries.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Playwright starts the app's own Vite server (reuseExistingServer is off
      # when CI=true, which GitHub Actions sets) and drives the real editor:
      # browser → worker (OCCT) → planegcs → physics → render, no mocks.
      - name: Run E2E
        run: pnpm run e2e

      # On failure, keep the HTML report + traces/screenshots for debugging.
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Python services (FastAPI): pytest for services/{reconstruct,capture,nerf,photogrammetry}. Conda envs
  # come from each service's environment.yml via micromamba (pythonocc-core is conda-forge
  # only). Runner feasibility — every claim below was verified against these env files
  # (2026-07, mlx 0.31.2 / occt 7.9.3), not assumed:
  #
  #  • reconstruct runs its FULL suite here. Its MLX use (fidelity/recognition math) works
  #    on Linux with the CPU backend, which must be installed explicitly: PyPI's bare `mlx`
  #    has NO backend on Linux (mlx-metal is Darwin-only; Linux backends are the extras
  #    mlx[cpu] / mlx[cuda]). One test is deselected: test_freeform_region_face_on_a_sphere_cap
  #    asserts interior fill accuracy < 1e-3, which OCCT's BRepOffsetAPI_MakeFilling meets on
  #    macOS but converges to 1.57e-3 on linux-64 with the SAME occt/pythonocc 7.9.3
  #    (platform numerics, measured; boundary accuracy still passes).
  #
  #  • capture/nerf/photogrammetry (MLX services) run ONLY their MLX-free tests here — the
  #    job-store suite (tests/test_jobs.py) for all three, plus photogrammetry's MLX-free
  #    emit-contract suite (tests/test_emit.py; app/emit.py + its tests/synthetic import chain
  #    are numpy/stdlib only — verified no `mlx` enters sys.modules):
  #    - GitHub macOS runners expose no Metal device (MTLCreateSystemDefaultDevice returns
  #      nil — actions/runner-images#1779), and MLX hard-aborts the whole process at import
  #      when no Metal device is visible (ml-explore/mlx#3148) — a fatal signal, not an
  #      ImportError, so even the suites' importorskip gates cannot save collection.
  #    - With mlx[cpu] on Linux, the training suites fatally crash the interpreter (fatal
  #      signal in the submit→poll E2E during asyncio teardown of the MLX worker thread;
  #      reproduced on BOTH linux/amd64 and linux/arm64 containers).
  #    The full MLX suites remain a local Apple-Silicon check:
  #    `mamba run -n plastiq-<service> python -m pytest` (see each service's README).
  python-services:
    name: services · ${{ matrix.service }} (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: reconstruct
            mlx-cpu: true
            pytest-args: >-
              --deselect tests/test_freeform.py::test_freeform_region_face_on_a_sphere_cap
          - service: capture
            pytest-args: tests/test_jobs.py
          - service: nerf
            pytest-args: tests/test_jobs.py
          - service: photogrammetry
            pytest-args: tests/test_jobs.py tests/test_emit.py
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Creates the env from the service's environment.yml and auto-activates it in
      # subsequent `bash -el {0}` steps.
      - uses: mamba-org/setup-micromamba@d7c9bd84e824b79d2af72a2d4196c7f4300d3476 # v3.0.0
        with:
          environment-file: services/${{ matrix.service }}/environment.yml
          cache-environment: true

      # Linux has no default MLX backend (see the job comment) — reconstruct imports
      # mlx.core at collection time (app/fidelity.py), so install the CPU backend.
      - name: Install the MLX Linux CPU backend
        if: ${{ matrix.mlx-cpu }}
        shell: bash -el {0}
        run: pip install "mlx[cpu]"

      - name: Test
        shell: bash -el {0}
        working-directory: services/${{ matrix.service }}
        run: python -m pytest -q ${{ matrix.pytest-args }}
