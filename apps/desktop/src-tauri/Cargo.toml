[package]
name = "plastiq-desktop"
version = "0.1.0"
description = "Plastiq desktop shell: a Tauri 2 app that hosts the Plastiq CAD editor (apps/plastiq)."
authors = ["LayerDynamics"]
edition = "2021"
license-file = "../../../LICENSE"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name; this
# matters on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "plastiq_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
